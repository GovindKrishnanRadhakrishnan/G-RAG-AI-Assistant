apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ollama
  namespace: rag-namespace
  labels:
    app: rag-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ollama
  template:
    metadata:
      labels:
        app: rag-ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: rag-ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ollama-service
  namespace: rag-namespace
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: ollama
  selector:
    app: rag-ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-ollama-pvc
  namespace: rag-namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard # Minikube/K3s default
