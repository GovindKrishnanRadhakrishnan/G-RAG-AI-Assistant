apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag.fullname" . }}-backend
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app: {{ include "rag.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "rag.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "rag.name" . }}-backend
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
              name: http-backend
          envFrom:
            - configMapRef:
                name: {{ include "rag.fullname" . }}-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag.fullname" . }}-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag.fullname" . }}-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: vector-db-storage
              mountPath: /app/vector_db
      volumes:
        - name: vector-db-storage
          emptyDir: {} # Lightweight local storage
