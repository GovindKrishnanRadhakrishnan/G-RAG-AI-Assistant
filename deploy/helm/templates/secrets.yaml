apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.fullname" . }}-secrets
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded or empty if not set
  OPENAI_API_KEY: {{ if .Values.secrets.openaiApiKey }}{{ .Values.secrets.openaiApiKey | b64enc | quote }}{{ else }}{{ "".Values.secrets.openaiApiKey | b64enc | quote }}{{ end }}
  ANTHROPIC_API_KEY: {{ if .Values.secrets.anthropicApiKey }}{{ .Values.secrets.anthropicApiKey | b64enc | quote }}{{ else }}{{ "".Values.secrets.anthropicApiKey | b64enc | quote }}{{ end }}
